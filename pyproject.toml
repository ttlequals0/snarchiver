[project]
name = "snarchiver"
version = "1.0.0"
description = "Archive the Security Now podcast into MinusPod-importable local-feed files"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
snarchiver = "snarchiver.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["snarchiver"]

[tool.uv]
# Never reuse a discovered interpreter: the MacPorts python3 on this machine
# has no CA bundle, so every HTTPS fetch fails cert verification.
python-preference = "only-managed"
